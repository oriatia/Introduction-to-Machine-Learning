name: hazar

on:
  push:
    paths: ["hazar/**", ".github/workflows/hazar.yml"]
  pull_request:
    paths: ["hazar/**", ".github/workflows/hazar.yml"]

concurrency:
  group: hazar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hazar

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hazar
          POSTGRES_PASSWORD: hazar
          POSTGRES_DB: hazar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hazar" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      HAZAR_TEST_DATABASE_URL: postgresql+asyncpg://hazar:hazar@localhost:5432/hazar_test
      HAZAR_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          working-directory: hazar
      - run: uv sync --all-packages --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: for pkg in services/api services/worker packages/tax_engine; do uv run mypy "$pkg"; done
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hazar/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hazar/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  e2e:
    needs: [python, web]
    runs-on: ubuntu-latest
    env:
      HAZAR_OTP_RESEND_COOLDOWN_SECONDS: "0"
      HAZAR_OTP_MAX_REQUESTS_PER_IP_PER_HOUR: "1000"
      HAZAR_OTP_MAX_REQUESTS_PER_PHONE_PER_HOUR: "100"
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        working-directory: hazar/infra
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hazar/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hazar/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env:
          CI: "true"
      - name: Stack logs
        if: failure()
        working-directory: hazar/infra
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: hazar/apps/web/playwright-report
          retention-days: 7
