[project]
name = "hazar-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["arq>=0.26", "hazar-api", "hazar-tax-engine"]

[tool.uv.sources]
hazar-api = { workspace = true }
hazar-tax-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hazar_worker"]
