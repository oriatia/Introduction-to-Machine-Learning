# Local development stack: `docker compose up --build` from this directory, then open http://localhost:3000.
# All secrets below are DEVELOPMENT-ONLY placeholders. Production takes secrets from the environment.
name: hazar

x-python-env: &python-env
  HAZAR_ENV: development
  HAZAR_DATABASE_URL: postgresql+asyncpg://hazar:hazar@postgres:5432/hazar
  HAZAR_REDIS_URL: redis://redis:6379/0
  HAZAR_APP_SECRET: dev-only-app-secret-change-me-0123456789abcdef
  HAZAR_MASTER_KEY_B64: ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=
  HAZAR_SMS_PROVIDER: mock
  HAZAR_COOKIE_SECURE: "false"
  HAZAR_TRUSTED_PROXY_COUNT: "1"
  HAZAR_S3_ENDPOINT_URL: http://s3:8333
  HAZAR_S3_ACCESS_KEY: hazar-local
  HAZAR_S3_SECRET_KEY: hazar-local-secret
  # Overridable so automated E2E runs can log the same phone in repeatedly.
  HAZAR_OTP_RESEND_COOLDOWN_SECONDS: ${HAZAR_OTP_RESEND_COOLDOWN_SECONDS:-60}
  HAZAR_OTP_MAX_REQUESTS_PER_IP_PER_HOUR: ${HAZAR_OTP_MAX_REQUESTS_PER_IP_PER_HOUR:-20}
  HAZAR_OTP_MAX_REQUESTS_PER_PHONE_PER_HOUR: ${HAZAR_OTP_MAX_REQUESTS_PER_PHONE_PER_HOUR:-5}

x-python-image: &python-image
  build:
    context: ..
    dockerfile: infra/docker/python.Dockerfile
    secrets: [extra_ca]
  image: hazar-python:dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hazar
      POSTGRES_PASSWORD: hazar
      POSTGRES_DB: hazar
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazar"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    <<: *python-image
    environment: *python-env
    working_dir: /app/services/api
    command: sh -c "alembic upgrade head && python -m hazar_api.seed"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *python-image
    environment: *python-env
    command: uvicorn --factory hazar_api.main:app_factory --host 0.0.0.0 --port 8000 --proxy-headers --no-access-log
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      retries: 40

  worker:
    <<: *python-image
    environment: *python-env
    command: arq hazar_worker.main.WorkerSettings
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
      secrets: [extra_ca]
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

secrets:
  # Only needed behind a TLS-intercepting proxy: HAZAR_EXTRA_CA_FILE=/path/to/ca.pem docker compose build
  extra_ca:
    file: ${HAZAR_EXTRA_CA_FILE:-./no-extra-ca.pem}

volumes:
  pgdata:
  s3data:
